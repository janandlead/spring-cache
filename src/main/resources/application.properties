spring.application.name=springboot-redis-cache-demo
server.port=8080


spring.datasource.url=jdbc:postgresql://localhost:5432/redis_db
spring.datasource.username=postgres
spring.datasource.password=root

# The PostgreSQL dependency in pom.xml supplies this driver. It can also be omitted,
# but keeping it makes the selected database explicit.
spring.datasource.driver-class-name=org.postgresql.Driver

# schema.sql is a manual PostgreSQL script because it contains \connect.
spring.sql.init.mode=never

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.cache.type=redis
spring.cache.redis.time-to-live=10m
spring.cache.redis.cache-null-values=false
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE
logging.level.com.durgasoft.redis=INFO
